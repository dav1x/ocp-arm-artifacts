--- 
apiVersion: ran.openshift.io/v1
kind: PolicyGenTemplate
metadata:
  name: "du-sno-418-arm"
  namespace: "ztp-group-du-sno"
spec:
  bindingRules:
    common-418-arch: "arm"
  mcp: "master"
  sourceFiles:

  # Order of policies application: cs-config-policy in wave1, subscription-policy in wave2, and config-policy in wave10
    ## PTP
    - fileName: PtpSubscriptionNS.yaml
      policyName: "subscriptions-policy"
    - fileName: PtpSubscriptionOperGroup.yaml
      policyName: "subscriptions-policy"
    - fileName: PtpSubscription.yaml
      policyName: "subscriptions-policy"
      spec:
        source: redhat-operators

    ## SRIOV
    - fileName: SriovSubscriptionNS.yaml
      policyName: "subscriptions-policy"
    - fileName: SriovSubscriptionOperGroup.yaml
      policyName: "subscriptions-policy"
    - fileName: SriovSubscription.yaml
      policyName: "subscriptions-policy"
      spec:
        source: redhat-operators
    - fileName: SriovOperatorConfig.yaml
      policyName: "config-policy"
      spec:
        disableDrain: true
        enableInjector: false
        enableOperatorWebhook: false
        logLevel: 0

    ## SRIOV FEC 
    # - fileName: AcceleratorsNS.yaml
    #  policyName: "subscriptions-policy"
    # - fileName: AcceleratorsOperGroup.yaml
    #  policyName: "subscriptions-policy"
    # - fileName: AcceleratorsSubscription.yaml
    #  policyName: "subscriptions-policy"
    #  spec:
    #    channel: "stable"
    #    name: sriov-fec
    #    source: certified-operators

    ## LSO
    - fileName: StorageNS.yaml
      policyName: "subscriptions-policy"
    - fileName: StorageOperGroup.yaml
      policyName: "subscriptions-policy"
    - fileName: StorageSubscription.yaml
      policyName: "subscriptions-policy"
      spec:
        source: redhat-operators
    - fileName: StorageClass.yaml
      policyName: "config-policy"
      metadata:
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
        labels:
          local.storage.openshift.io/owner-name: local-disks
        name: fs-lso
    
    # single disk
    #- fileName: StorageLV.yaml
    #  policyName: "config-policy"
    #  spec:
    #    storageClassDevices:
    #      - devicePaths:
    #          - /dev/nvme1n1p1
    #          - /dev/nvme1n1p2
    #          - /dev/nvme1n1p3
    #          - /dev/nvme1n1p4
    #          - /dev/nvme1n1p5
    #          - /dev/nvme1n1p30
    #        fsType: ext4
    #        storageClassName: fs-lso
    #        volumeMode: Filesystem

    - fileName: PerformanceProfile.yaml
      policyName: "config-policy"
      spec:
        additionalKernelArgs:
          - rcupdate.rcu_normal_after_boot=0
          - efi=runtime
          - vfio_pci.enable_sriov=1
          - vfio_pci.disable_idle_d3=1
          - module_blacklist=irdma
          - iommu.passthrough=1
        cpu:
          isolated: 2-127
          reserved: 0-1
        hugepages:
          defaultHugepagesSize: 512M
          pages:
            - size: 512M
              count: 32
        machineConfigPoolSelector:
          pools.operator.machineconfiguration.openshift.io/master: ""
        nodeSelector:
          node-role.kubernetes.io/master: ""
        #numa:
        #  topologyPolicy: "single-numa-node"
        # To use the standard (non-realtime) kernel, set enabled to false
        realTimeKernel:
          enabled: false
        workloadHints:
          # WorkloadHints defines the set of upper level flags for a different type of workloads.
          # See https://github.com/openshift/cluster-node-tuning-operator/blob/master/docs/performanceprofile/performance_profile.md#workloadhints
          # for detailed descriptions of each item.
          # The configuration below is set for a low latency, performance mode.
          realTime: true
          highPowerConsumption: false
          perPodPowerManagement: false

    ## NTO - ARM based driver cppc_cpufreq
    # Removing 
    # cmdline_del=-intel_pstate=disable
    # cmdline_del1=-intel_iommu=on iommu=pt
    # cmdline_del2=-tsc=reliable
    # cmdline_add=iommu.passthrough=1
    # cmdline_add2=default_hugepagesz=512M hugepagesz=512M hugepages=32

    - fileName: TunedPerformancePatch.yaml
      policyName: "config-policy"
      spec:
        profile:
        - name: performance-patch
          data: |
            [main]
            summary=Configuration changes profile inherited from performance created tuned
            include=openshift-node-performance-openshift-node-performance-profile
            [service]
            service.stalld=stop,disable
            service.chronyd=stop,disable
            [cpu]
            enabled=false
            [sysctl]
            kernel.timer_migration=0

    ## Footprint policies
    - fileName: ReduceMonitoringFootprint.yaml
      policyName: "config-policy"
      metadata:
        annotations:
          ran.openshift.io/ztp-deploy-wave: "10"
      
    ## NETWORK
    - fileName: DisableSnoNetworkDiag.yaml #wave 10
      policyName: "config-policy"
    ## OLM
    - fileName: DisableOLMPprof.yaml # wave 10
      policyName: "config-policy"

    ## LCA
    - fileName: LcaSubscriptionNS.yaml
      policyName: "subscriptions-policy"
    - fileName: LcaSubscriptionOperGroup.yaml
      policyName: "subscriptions-policy"
    - fileName: LcaSubscription.yaml
      policyName: "subscriptions-policy"
      spec:
        source: redhat-operators

    ## LOGGING
    - fileName: ClusterLogNS.yaml
      policyName: "subscriptions-policy"
    - fileName: ClusterLogOperGroup.yaml
      policyName: "subscriptions-policy"
    - fileName: ClusterLogSubscription.yaml
      policyName: "subscriptions-policy"
      spec:
        channel: stable-6.1
        source: redhat-operators
    - fileName: ClusterLogServiceAccount.yaml
      policyName: "subscriptions-policy"
    - fileName: ClusterLogServiceAccountAuditBinding.yaml
      policyName: "subscriptions-policy"
    - fileName: ClusterLogServiceAccountInfrastructureBinding.yaml
      policyName: "subscriptions-policy"
    - fileName: ClusterLogForwarder.yaml
      policyName: "config-policy"
      spec:
        outputs:
          - kafka:
              url: tcp://jumphost.inbound.vz.bos2.lab:9092/{{ fromClusterClaim "name" }}
            name: kafka-open
            type: kafka
        pipelines:
          - name: all-to-default
            inputRefs:
              - audit
              - infrastructure
#              - application
            outputRefs:
              - kafka-open
        serviceAccount:
          name: collector

    #PTPCONFIG
    - fileName: PtpOperatorConfig.yaml
      policyName: "config-policy"
    - fileName: PtpConfigSlave.yaml
      policyName: "config-policy"
      metadata:
        name: "du-ptp-slave"
      spec:
        profile:
        - name: "slave"
          interface: "enP3p1s0f0np0"
          phc2sysOpts: "-a -r -n 24"
          ptp4lOpts: "-2 -s"
          ptpSchedulingPolicy: SCHED_FIFO
          ptpSchedulingPriority: 10
          ptp4lConf: |
            [global]
            #
            # Default Data Set
            #
            twoStepFlag 1
            slaveOnly 1
            priority1 128
            priority2 128
            domainNumber 24
            #utc_offset 37
            clockClass 255
            clockAccuracy 0xFE
            offsetScaledLogVariance 0xFFFF
            free_running 0
            freq_est_interval 1
            dscp_event 0
            dscp_general 0
            dataset_comparison G.8275.x
            G.8275.defaultDS.localPriority 128
            #
            # Port Data Set
            #
            logAnnounceInterval -3
            logSyncInterval -4
            logMinDelayReqInterval -4
            logMinPdelayReqInterval -4
            announceReceiptTimeout 3
            syncReceiptTimeout 0
            delayAsymmetry 0
            fault_reset_interval -4
            neighborPropDelayThresh 20000000
            masterOnly 0
            G.8275.portDS.localPriority 128
            #
            # Run time options
            #
            assume_two_step 0
            logging_level 6
            path_trace_enabled 0
            follow_up_info 0
            hybrid_e2e 0
            inhibit_multicast_service 0
            net_sync_monitor 0
            tc_spanning_tree 0
            tx_timestamp_timeout 50
            unicast_listen 0
            unicast_master_table 0
            unicast_req_duration 3600
            use_syslog 1
            verbose 0
            summary_interval 0
            kernel_leap 1
            check_fup_sync 0
            clock_class_threshold 7
            #
            # Servo Options
            #
            pi_proportional_const 0.0
            pi_integral_const 0.0
            pi_proportional_scale 0.0
            pi_proportional_exponent -0.3
            pi_proportional_norm_max 0.7
            pi_integral_scale 0.0
            pi_integral_exponent 0.4
            pi_integral_norm_max 0.3
            step_threshold 2.0
            first_step_threshold 0.00002
            max_frequency 900000000
            clock_servo pi
            sanity_freq_limit 200000000
            ntpshm_segment 0
            #
            # Transport options
            #
            transportSpecific 0x0
            ptp_dst_mac 01:1B:19:00:00:00
            p2p_dst_mac 01:80:C2:00:00:0E
            udp_ttl 1
            udp6_scope 0x0E
            uds_address /var/run/ptp4l
            #
            # Default interface options
            #
            clock_type OC
            network_transport L2
            delay_mechanism E2E
            time_stamping hardware
            tsproc_mode filter
            delay_filter moving_median
            delay_filter_length 10
            egressLatency 0
            ingressLatency 0
            boundary_clock_jbod 0
            #
            # Clock description
            #
            productDescription ;;
            revisionData ;;
            manufacturerIdentity 00:00:00
            userDescription ;
            timeSource 0xA0
